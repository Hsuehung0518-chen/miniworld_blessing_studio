<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07111f" />
<title>MiniWorld Blessing Studio v1.1｜瓶中祝福創作模板</title>
<style>
:root{--ui-scale:1;--bg:#07111f;--panel:#0c1b2d;--panel2:#10243b;--text:#f4f7fb;--muted:#9eb0c6;--line:rgba(255,255,255,.12);--accent:#78d6ff;--accent2:#d7b56d;--ok:#75e0b0;--danger:#ff9a9a;--shadow:0 18px 55px rgba(0,0,0,.28);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box} html{font-size:calc(16px * var(--ui-scale))} body{margin:0;background:radial-gradient(circle at 50% -20%,#183659 0,#07111f 45%,#050b13 100%);color:var(--text);min-height:100%;}
button,input,select,textarea{font:inherit}.app{width:min(1120px,100%);margin:auto;padding:18px 16px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;background:linear-gradient(145deg,rgba(120,214,255,.18),rgba(215,181,109,.12));font-size:22px}.brand h1{font-size:clamp(18px,3vw,24px);margin:0}.brand small{color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.05);color:var(--text);cursor:pointer}.btn:hover{background:rgba(255,255,255,.09)}.btn.primary{background:linear-gradient(135deg,var(--accent),#8f88ff);color:#06111c;border:none;font-weight:800}.btn.gold{background:linear-gradient(135deg,#f0d28e,var(--accent2));color:#241b09;border:none;font-weight:800}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(120,214,255,.48);outline-offset:2px}
.hero{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(300px,.78fr);gap:16px;align-items:stretch}.hero>*{min-width:0}.stage,.controls,.output{min-width:0;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:var(--shadow)}.stage{padding:18px;position:relative;overflow:hidden;min-height:560px;display:flex;flex-direction:column}.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,rgba(120,214,255,.13),transparent 44%);pointer-events:none}.scene-wrap{display:grid;place-items:center;flex:1;min-height:460px;position:relative}.fishbowl{position:relative;width:min(74vw,470px);aspect-ratio:1/1;border-radius:50% 50% 45% 45%;overflow:hidden;border:2px solid rgba(255,255,255,.42);box-shadow:inset 0 0 35px rgba(255,255,255,.16),0 30px 80px rgba(0,0,0,.33)}.fishbowl::after{content:"";position:absolute;inset:7% 11% auto auto;width:18%;height:48%;border-radius:50%;background:linear-gradient(110deg,rgba(255,255,255,.6),rgba(255,255,255,0));filter:blur(1px);transform:rotate(-18deg);pointer-events:none}.world{position:absolute;inset:0;background:linear-gradient(180deg,#8bd3f7 0%,#97e2ff 35%,#1f76a5 72%,#0b3756 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}.world[data-mood="aurora"]{background:radial-gradient(circle at 55% 22%,rgba(86,255,195,.34),transparent 25%),linear-gradient(180deg,#071944 0%,#0b285c 48%,#0d466d 100%)}.world[data-mood="sunset"]{background:linear-gradient(180deg,#ffd89a 0%,#ffb08b 46%,#3b7591 100%)}.world[data-mood="garden"]{background:linear-gradient(180deg,#b9e6ff 0%,#dff4c3 52%,#5fa472 100%)}.uploaded{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.has-image .uploaded{display:block}.has-image .demo-world{opacity:0}.demo-world{position:absolute;inset:0;transition:.25s}.whale{position:absolute;left:11%;top:26%;width:78%;height:38%;border-radius:52% 58% 48% 55%;background:linear-gradient(155deg,#24577f,#0c2744);transform:rotate(12deg);box-shadow:inset 0 -18px 30px rgba(0,0,0,.25)}.whale:before{content:"";position:absolute;width:34%;height:34%;right:-14%;top:34%;background:#173d61;border-radius:50% 100% 50% 100%;transform:rotate(8deg)}.flowers{position:absolute;left:18%;top:22%;width:64%;height:18%;background:radial-gradient(circle,#ff7ca5 0 10%,transparent 11%) 0 0/30px 30px,radial-gradient(circle,#ffd16b 0 12%,transparent 13%) 12px 8px/34px 34px,radial-gradient(circle,#7ce2a2 0 11%,transparent 12%) 5px 5px/38px 38px;filter:saturate(1.15)}.ground{position:absolute;left:-10%;right:-10%;bottom:-2%;height:31%;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.24),transparent 40%),linear-gradient(#54b79d,#175963);border-radius:50% 50% 0 0}.petals{position:absolute;inset:0;background-image:radial-gradient(circle at 10% 20%,#ffc2d7 0 3px,transparent 4px),radial-gradient(circle at 75% 18%,#f4ce63 0 3px,transparent 4px),radial-gradient(circle at 44% 62%,#ff9dc0 0 3px,transparent 4px),radial-gradient(circle at 84% 48%,#b7f19b 0 3px,transparent 4px);background-size:95px 95px,120px 120px,140px 140px,115px 115px;opacity:.88}.glass-text{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);width:78%;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.35)}.glass-text .main{font-size:clamp(30px,6vw,58px);font-weight:900;color:#f4d798;letter-spacing:.08em}.glass-text .sub{margin-top:6px;font-size:clamp(14px,2vw,19px);font-weight:800;line-height:1.45;color:#fff3d2;background:rgba(5,18,29,.42);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16)}.base{width:72%;height:42px;margin:-10px auto 0;border-radius:50%;background:linear-gradient(#855932,#3a2416);box-shadow:0 8px 20px rgba(0,0,0,.4)}.stage-note{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}.controls{padding:18px}.controls h2,.output h2{margin:0 0 12px;font-size:18px}.form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:6px;font-size:13px;color:#dbe7f4}.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18);color:var(--text);padding:12px;min-height:44px}.form-group textarea{min-height:84px;resize:vertical}.range-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.range-row output{color:var(--accent);font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:40px;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer}.chip.active{background:rgba(120,214,255,.16);border-color:rgba(120,214,255,.55)}.recipe{min-width:0;max-width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.recipe div{border:1px solid var(--line);border-radius:13px;padding:10px 8px;text-align:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.025)}.recipe b{display:block;color:var(--text);font-size:18px;margin-bottom:2px}.output{margin-top:16px;padding:18px}.output-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.025)}.panel h3{margin:0 0 8px;font-size:15px}.result{white-space:pre-wrap;color:#dce7f4;line-height:1.65;font-size:14px;max-height:260px;overflow:auto}.toast{margin-top:10px;min-height:22px;color:var(--ok);font-size:13px}.file-label{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed rgba(255,255,255,.25);border-radius:14px;padding:14px;cursor:pointer;color:#dce7f4;background:rgba(255,255,255,.035)}.file-label input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden}.footer-note{color:var(--muted);text-align:center;font-size:12px;margin-top:14px}
@media(max-width:860px){.hero{grid-template-columns:1fr}.stage{min-height:480px}.scene-wrap{min-height:380px}.fishbowl{width:min(86vw,430px)}.output-grid{grid-template-columns:1fr}.recipe{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}.topbar{align-items:flex-start;flex-direction:column}}@media(max-width:360px){.recipe{grid-template-columns:repeat(3,1fr);overflow:visible}.fishbowl{width:min(82vw,430px)}.app{padding-left:12px;padding-right:12px}}
@media(prefers-reduced-motion:no-preference){.fishbowl{animation:floaty 7s ease-in-out infinite}@keyframes floaty{50%{transform:translateY(-5px)}}}
body.light{--bg:#edf3f8;--panel:#fff;--panel2:#f7fafc;--text:#172333;--muted:#64748b;--line:rgba(16,35,52,.14);--shadow:0 16px 45px rgba(30,50,70,.12);background:linear-gradient(#eef6fb,#f9fbfd)}body.light .stage,body.light .controls,body.light .output{background:rgba(255,255,255,.82)}body.light .form-group input,body.light .form-group select,body.light .form-group textarea{background:#fff;color:#172333}body.light .chip{background:#fff;color:#172333}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="topbar">
    <div class="brand"><div class="logo">🫧</div><div><h1>MiniWorld Blessing Studio</h1><small>把一張祝福圖，變成可收藏的瓶中微縮世界</small></div></div>
    <div class="top-actions"><button class="btn" id="fontBtn" type="button" aria-label="切換字體大小">Aa 標準</button><button class="btn" id="themeBtn" type="button">☀️ 明亮模式</button><a class="btn" href="guide.html" style="text-decoration:none;display:inline-flex;align-items:center">📖 操作說明</a><button class="btn" id="resetBtn" type="button">↺ 重設</button></div>
  </div>

  <section class="hero">
    <div class="stage" aria-label="沉浸式預覽舞台">
      <div class="scene-wrap">
        <div>
          <div class="fishbowl" id="bowl">
            <div class="world" id="world" data-mood="garden">
              <img class="uploaded" id="previewImg" alt="使用者上傳的原始祝福圖預覽" />
              <div class="demo-world" aria-hidden="true"><div class="ground"></div><div class="whale"></div><div class="flowers"></div><div class="petals"></div></div>
              <div class="glass-text"><div class="main" id="mainPreview">日安</div><div class="sub" id="subPreview">日日常歡愉<br>事事皆順意</div></div>
            </div>
          </div>
          <div class="base"></div>
        </div>
      </div>
      <div class="stage-note">背景是舞台，容器世界才是主角。上傳圖片後會直接進入魚缸預覽。</div>
    </div>

    <aside class="controls">
      <h2>創作設定</h2>
      <label class="file-label">🖼️ 載入原始祝福圖<input id="imageInput" type="file" accept="image/*" /></label>
      <div class="form-group"><label for="mainText">主祝福</label><input id="mainText" value="日安" maxlength="12" /></div>
      <div class="form-group"><label for="subText">次祝福</label><textarea id="subText" maxlength="80">日日常歡愉\n事事皆順意</textarea></div>
      <div class="form-group"><label for="containerType">玻璃容器</label><select id="containerType"><option>圓形魚缸</option><option>玻璃茶壺</option><option>香水瓶</option><option>實驗燒瓶</option><option>玻璃燈泡</option><option>透明寶石盒</option></select></div>
      <div class="form-group"><label>世界氛圍</label><div class="chips" id="moodChips"><button class="chip active" type="button" data-mood="garden">🌸 花園晴空</button><button class="chip" type="button" data-mood="aurora">🌌 極光夜境</button><button class="chip" type="button" data-mood="sunset">🌅 金色夕映</button></div></div>
      <div class="form-group"><label for="depth">微縮景深</label><div class="range-row"><input id="depth" type="range" min="1" max="5" value="4"/><output id="depthOut">4/5</output></div></div>
      <div class="form-group"><label for="hero">靈魂主角</label><input id="hero" value="保留原圖的花鯨與小女孩" /></div>
      <button class="btn primary" id="forgeBtn" type="button" style="width:100%">✨ 生成 Mini World 配方</button>
      <div class="recipe" aria-label="創作公式"><div><b>①</b>原圖</div><div><b>②</b>主角</div><div><b>③</b>微縮</div><div><b>④</b>入瓶</div><div><b>⑤</b>文字實體化</div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </aside>
  </section>

  <section class="output" aria-live="polite">
    <h2>可直接分享／生成的成果</h2>
    <div class="output-grid">
      <div class="panel"><h3>AI 生圖提示詞</h3><div class="result" id="promptOut"></div><button class="btn" id="copyPromptBtn" type="button" style="margin-top:10px">⧉ 複製提示詞</button></div>
      <div class="panel"><h3>分享文案</h3><div class="result" id="shareOut"></div><button class="btn" id="copyShareBtn" type="button" style="margin-top:10px">⧉ 複製文案</button></div>
    </div>
    <div class="footer-note">提示：此 HTML 可直接本機開啟，也可部署至 GitHub Pages / Netlify。｜<a href="qa_report.html" style="color:var(--accent)">查看沙盒實測報告</a></div>
  </section>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id);
 const els={app:$('app'),bowl:$('bowl'),world:$('world'),previewImg:$('previewImg'),imageInput:$('imageInput'),mainText:$('mainText'),subText:$('subText'),containerType:$('containerType'),depth:$('depth'),depthOut:$('depthOut'),hero:$('hero'),mainPreview:$('mainPreview'),subPreview:$('subPreview'),promptOut:$('promptOut'),shareOut:$('shareOut'),forgeBtn:$('forgeBtn'),themeBtn:$('themeBtn'),resetBtn:$('resetBtn'),fontBtn:$('fontBtn'),copyPromptBtn:$('copyPromptBtn'),copyShareBtn:$('copyShareBtn'),toast:$('toast'),moodChips:$('moodChips')};
 let mood='garden', objectUrl='';
 function safeText(v,fallback){v=(v||'').trim();return v||fallback}
 function updatePreview(){els.mainPreview.textContent=safeText(els.mainText.value,'祝福');els.subPreview.innerHTML=safeText(els.subText.value,'願日日安好').split(/\n+/).map(s=>s.replace(/[<>]/g,'')).join('<br>');els.depthOut.value=els.depth.value+'/5';const blur=(5-Number(els.depth.value))*.45;els.world.style.filter=blur?`contrast(1.02) saturate(1.04) blur(${blur}px)`:'contrast(1.02) saturate(1.04)';}
 function forge(){
   const main=safeText(els.mainText.value,'祝福'), sub=safeText(els.subText.value,'願日日安好'), container=els.containerType.value, hero=safeText(els.hero.value,'保留原圖核心主角');
   const moodLabel={garden:'明亮花園晴空、柔和水光與漂浮花瓣',aurora:'深藍星夜、天際極光、濕潤反射與電影級體積光',sunset:'金色夕照、溫暖柔光、夢幻反射與收藏級氛圍'}[mood];
   els.promptOut.textContent=`Create a premium fine-art miniature diorama contained entirely inside a ${container}. Preserve the emotional identity of the source image and especially ${hero}. Rebuild the scene as a coherent handcrafted mini world with realistic miniature scale, layered foreground/midground/background, tiny plants, pathways, water details and collectible craftsmanship. Atmosphere: ${moodLabel}. Use tilt-shift macro photography, shallow depth of field ${els.depth.value}/5, cinematic lighting, realistic glass reflections and refraction, premium 3D collectible presentation. Integrate accurate Traditional Chinese physical 3D lettering: “${main}” and “${sub.replace(/\n/g,'，')}”. Keep the external display stage simple, low-detail and clearly distinct from the inner world. No duplicated landmarks, no competing focal point, no watermark, no logo, no garbled text, no extra limbs.`;
   els.shareOut.textContent=`《${main}｜瓶中祝福 Mini World》\n把一張平面的祝福圖，留下最有感的主角與情緒，再重新雕成一座可收藏的玻璃微縮世界。\n\n${sub}\n\n創作公式：原始祝福圖 → 保留靈魂主角 → 場景微縮立體化 → 收進玻璃容器 → 祝福文字實體化。`;
   els.toast.textContent='✓ 配方已更新，可直接選取文字使用。';
 }
 function setTheme(light){document.body.classList.toggle('light',light);els.themeBtn.textContent=light?'🌙 深色模式':'☀️ 明亮模式';try{localStorage.setItem('mw-theme',light?'light':'dark')}catch(e){}}
 const fontScales=[1,1.12,1.25]; let fontIndex=0;
 function setFont(i){fontIndex=(i+fontScales.length)%fontScales.length;document.documentElement.style.setProperty('--ui-scale',fontScales[fontIndex]);els.fontBtn.textContent=['Aa 標準','Aa 大字','Aa 特大'][fontIndex];try{localStorage.setItem('mw-font',String(fontIndex))}catch(e){}}
 async function copyText(text,label){let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(!ok){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='absolute';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove()}els.toast.textContent=ok?`✓ 已複製${label}。`:`無法自動複製，請長按文字選取。`;}
 try{const savedTheme=localStorage.getItem('mw-theme');if(savedTheme)setTheme(savedTheme==='light');const savedFont=Number(localStorage.getItem('mw-font'));if(Number.isInteger(savedFont)&&savedFont>=0&&savedFont<fontScales.length)setFont(savedFont)}catch(e){}
 els.imageInput.addEventListener('change',()=>{const f=els.imageInput.files&&els.imageInput.files[0];if(!f)return;if(!f.type.startsWith('image/')){els.toast.textContent='請選擇圖片檔。';return}if(f.size>12*1024*1024){els.toast.textContent='圖片請小於 12MB。';return}if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);els.previewImg.src=objectUrl;els.bowl.classList.add('has-image');els.toast.textContent='✓ 圖片已載入魚缸預覽。';});
 [els.mainText,els.subText,els.depth].forEach(el=>el.addEventListener('input',updatePreview));
 els.moodChips.addEventListener('click',e=>{const b=e.target.closest('button[data-mood]');if(!b)return;mood=b.dataset.mood;els.world.dataset.mood=mood;[...els.moodChips.querySelectorAll('.chip')].forEach(x=>x.classList.toggle('active',x===b));forge();});
 els.forgeBtn.addEventListener('click',forge);
 els.themeBtn.addEventListener('click',()=>setTheme(!document.body.classList.contains('light')));
 els.fontBtn.addEventListener('click',()=>setFont(fontIndex+1));
 els.copyPromptBtn.addEventListener('click',()=>copyText(els.promptOut.textContent,'提示詞'));
 els.copyShareBtn.addEventListener('click',()=>copyText(els.shareOut.textContent,'文案'));
 els.resetBtn.addEventListener('click',()=>{els.mainText.value='日安';els.subText.value='日日常歡愉\n事事皆順意';els.containerType.value='圓形魚缸';els.depth.value='4';els.hero.value='保留原圖的花鯨與小女孩';mood='garden';els.world.dataset.mood='garden';[...els.moodChips.querySelectorAll('.chip')].forEach(x=>x.classList.toggle('active',x.dataset.mood==='garden'));els.imageInput.value='';els.previewImg.removeAttribute('src');els.bowl.classList.remove('has-image');if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=''}updatePreview();forge();els.toast.textContent='已恢復示範設定。';});
 updatePreview();forge();
})();
</script>
</body>
</html>
